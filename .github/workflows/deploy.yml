name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Build Frontend in Docker
        run: |
          echo "Building with Node 20 in Docker"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la $GITHUB_WORKSPACE
          docker run --rm -v "$GITHUB_WORKSPACE":/app -w /app node:20-alpine sh -c "ls -la &&npm install && npm run build"

      - name: Copy dist to portfolio folder and Deploy
        run: |
          echo "Copying dist to /home/shenkz/portfolio"
          rsync -a --delete $GITHUB_WORKSPACE/dist/ /home/shenkz/portfolio/dist/

          echo "Copying docker files"
          cp $GITHUB_WORKSPACE/docker-compose.yml $GITHUB_WORKSPACE/nginx.conf /home/shenkz/portfolio/

          echo "Restarting Containers"
          cd /home/shenkz/portfolio
          docker compose up -d --build --no-deps portfolio
          docker compose ps
          echo "Deployment finished successfully!"