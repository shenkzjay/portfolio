name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Copy dist to /_work/shenkz/portfolio folder and Deploy
        run: |
          mkdir -p /_work/shenkz/portfolio/dist

          echo "Copying dist to /_work/shenkz/portfolio"
          rm -rf /_work/shenkz/portfolio/dist
          cp -r ./dist /_work/shenkz/portfolio/dist

          echo "Copying docker files"
          cp docker-compose.yml nginx.conf /_work/shenkz/portfolio/

          echo "Restarting Containers"
          cd /_work/shenkz/portfolio
          docker compose up -d --build --no-deps portfolio
          docker compose ps
        

