name: deploy

on:
  push:
    branches: [main]
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Staging server
        run: |
          echo "Deploying to local staging...."
          rm -rf ~/portfolio/dist/*
          cp -r dist/* ~/portfolio/dist/
          cd ~/moodle-infra/multitenant && docker compose restart portfolio
          
        