name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build
          
      - name: Deploy to /opt/portfolio
        run: |
          set -e # stop on first error
          
          echo "1. Copying dist"
          rm -rf /opt/portfolio/dist
          mkdir -p /opt/portfolio/dist

          echo "2. Copying dist folder"
          cp -a ./dist/. /opt/portfolio/dist/

          echo "3. Copying docker files"
          cp ./docker-compose.yml /opt/portfolio/
          cp ./nginx.conf /opt/portfolio/

          echo "4. Validating Compose"
          cd /opt/portfolio
          docker compose config # this will validate service name first

          echo "5. Rebuilding and restarting containers"
          docker compose up -d --build

          echo "6. Checking container status"
          docker compose ps