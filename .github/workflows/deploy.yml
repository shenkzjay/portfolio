name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Build Frontend in Docker
        run: |
          echo "Building with Node 20 in Docker"
          docker run --rm -v /home/shenkz/portfolio:/app -w /app node:20-alpine sh -c "ls -la &&npm install && npm run build"

      - name: Copy dist to portfolio folder and Deploy
        run: |
          echo "Copying dist"
          rsync -a --delete /home/shenkz/portfolio/dist/ /home/shenkz/portfolio/dist/
          echo "Restarting Containers"
          cd /home/shenkz/portfolio
          docker compose up -d --build --no-deps portfolio