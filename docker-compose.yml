services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio-web
    mem_limit: 128M
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - multitenant_mt-net


networks:
  multitenant_mt-net:
    external: true
