services:
  porfolio:
    image: nginx:alpine
    container_name: porfolio-web
    mem_limit: 128M
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro


networks:
  default:
    external: true
    name: multitenant-mt_net
